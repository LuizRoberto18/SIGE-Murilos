{% extends 'base.html' %}
{% block title %}{{ titulo }} | Pizzaria Murilo's{% endblock %}
{% block content %}
<h1 class="h2 mb-3">{{ titulo }}</h1>
<form method="post" class="form-card card p-4">
  {% csrf_token %}{{ form.as_p }}
  <div class="d-flex gap-2"><button class="btn btn-brand">Salvar</button><a class="btn btn-outline-secondary" href="{% url 'pizzas:listar' %}">Cancelar</a></div>
</form>
{% endblock %}
