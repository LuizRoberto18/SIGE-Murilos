{% extends 'base.html' %}
{% block title %}{{ titulo }} | SIGE Murilo's{% endblock %}
{% block content %}
<h1 class="h2 mb-3">{{ titulo }}</h1>
<p class="text-muted">Informe o tipo, o intervalo de datas e o total de pedidos. As datas do período não podem coincidir com outro registro.</p>
<form method="post" class="form-card card p-4">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="d-flex gap-2">
    <button class="btn btn-brand" type="submit">Salvar</button>
    <a class="btn btn-outline-secondary" href="{% url 'vendas:listar' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
